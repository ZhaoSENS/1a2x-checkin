name: 1A2X Daily Check-in

on:
  schedule:
    # GitHub Actions cron 为 UTC：以下两行 = 北京时间 08:05 / 20:05
    - cron: '5 0 * * *'
    - cron: '5 12 * * *'
  workflow_dispatch:

concurrency:
  group: 1a2x-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check-in
        env:
          A2X_COOKIE: ${{ secrets.A2X_COOKIE }}
        run: python checkin.py

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          echo '签到失败：Cookie 可能已过期，请重新抓取并更新 Secret A2X_COOKIE'
          if [ -n "$WEBHOOK" ]; then
            curl -sS -m 20 -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d '{"msgtype":"text","text":{"content":"1A2X 签到失败：Cookie 可能已过期"}}' || true
          fi

  # GitHub 在仓库连续 60 天无提交时会自动停用 schedule，
  # 这个 job 每天写一行时间戳，让仓库始终有活动，定时任务不会被停。
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep schedule alive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
